name: Tool loop examples
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/tools_loop.test.ts
